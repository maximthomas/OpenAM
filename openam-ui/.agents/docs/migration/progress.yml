- id: 1-1
  description: migration analysis
  details: |
    Analyzed the current tech stack (Backbone.js 1.1.2, RequireJS AMD, jQuery 3.7.1,
    Handlebars 4.7.7, Bootstrap 3.3.5, LESS, Grunt, Karma/Mocha) and defined a
    migration plan targeting Vue 3 with Vite. All architectural decisions resolved
    through iterative interview process.
  status: complete

- id: 2-1
  description: scaffolding - Vite + Vue 3 project setup
  details: |
    Initialized Vite 8 project in openam-ui-ria with Vue 3.5, TypeScript 5.8 (strict),
    Vue Router 4.5, vue-i18n 11, Vitest 3. Created src/main/vue/ directory alongside
    src/main/js/. Configured vite.config.ts, tsconfig.json, vitest.config.ts (happy-dom).
    Added npm scripts (dev:vite, build:vite, test:unit). Updated pom.xml with vite-build
    execution at compile phase. Updated zip.xml with second fileSet for target/compiled-vite/.
    Smoke test passes, Vite build produces assets in ~320ms.
  status: complete

- id: 2-2
  description: extract pure TS commons services
  details: |
    Created src/main/vue/services/ with 7 pure TypeScript modules (569 lines total):
    constants.ts (merged commons + OpenAM constants), events.ts (synchronous emitter),
    config.ts (reactive standalone), api.ts (Axios RestClient + getDifferences + errorsHandlers),
    i18n.ts (thin vue-i18n wrapper), theme.ts (parameter-based getTheme with vanilla DOM),
    themeConfiguration.ts (ported ThemeConfig). Zero Backbone/jQuery/AMD dependencies.
    48 Vitest tests passing. vue-tsc clean.
  status: complete

- id: 2-3
  description: migrate main-device entry point
  details: |
    Ported main-device.js (88 lines) to Vue 3 SFC with UMD library output.
    Created 7 Vue components: DeviceApp.vue (root, conditional state switching),
    DeviceForm.vue (raw POST form with Bootstrap 3 classes, ARIA attrs), DeviceDone.vue
    (jumbotron thank-you), DeviceError.vue (alert warning), LoginHeader.vue (logo from
    reactive config), LoginFooter.vue (mailto + copyright). Created device-main.ts
    bootstrap (reads window.pageData, configures i18n via configureI18n(), applies theme,
    mounts at #wrapper, restores body display). Added configureI18n() to i18n/index.ts
    (fetches translations via HTTP, loads into vue-i18n). Created types/device.d.ts
    (DevicePageData interface + Window.pageData). Updated vite.config.ts for library mode
    UMD output (build.lib) with SPA dev server fallback. Added i18next-http-backend dep.
    Created test helper (helpers/device.ts) + 12 Vitest component tests. Verification:
    tsc clean (0 new errors), vite build produces main-device.js 246KB (86KB gzipped)
    with UMD wrapper confirmed, 60/60 tests pass (48 existing + 12 new).
  status: complete

- id: 2-4
  description: migrate main-authorize entry point
  details: |
    Ported main-authorize.js (162 lines) + OAuth2ConsentPageHelper.js (46 lines)
    to Vue 3 SFC with UMD library output. Created types/authorize.d.ts with
    AuthorizePageData interface (oauth2Data, error, noScopes, realm, locale, baseUrl).
    Created services/oauth2.ts extracting getUserSessionId() — computes base URL
    from Constants.context, fetches /serverinfo/*, reads CSRF cookie. Created
    authorize-main.ts bootstrap (cleanValues removes empty scope/claims values,
    precomputes noScopes flag, fetches csrf before mount). Created 4 Vue components:
    AuthorizeApp.vue (root: #login-base > logo + container > footer, v-if/v-else for
    error vs form), ErrorDisplay.vue (alert-warning with optional URI link, v-html for
    server-sanitized content), AuthorizeForm.vue (consent form: displayName,
    displayDescription, ScopeList for scopes+claims, signed-in-as, 8 hidden fields,
    deny/allow buttons, save-consent checkbox), ScopeList.vue (reusable collapsible
    panel list with reactive Record<number,boolean> toggle, keyboard accessible).
    Widened configureI18n param type to { locale?: string } in i18n/index.ts. Updated
    vite.config.ts with VITE_UMD_ENTRY env variable (Vite 8 UMD single-entry
    constraint). Updated mock-server/server.js with 4 authorize scenarios (consent,
    consent-no-details, error, error-with-uri) + landing page section. Added
    checkAuthorizePage() to mock-server/checks.js. Created test helper + 12 Vitest
    component tests. Verification: 72/72 tests pass (48 services + 12 device +
    12 authorize), both UMD bundles build (main-device.js 246KB, main-authorize.js
    293KB).
  status: complete

- id: 3-1
  description: main SPA - router + layout
  details: |
    Set up Vue Router 4 with hash mode (createWebHashHistory). Created 90 named routes
    covering all Backbone route configs: AMRoutesConfig (8), RealmsRoutes (30 realm-scoped
    child routes), GlobalRoutes (14 + 8 server edit + 8 server defaults), UMARoutes (12),
    CommonRoutesConfig (login/logout/404), UserRoutesConfig (profile/forgot/pw-reset/register).
    Created types/router.d.ts (RouteMeta: roles, navGroup, view). Created composables:
    useAuth.ts (reactive loggedUser, hasRole/hasAnyRole, isAuthenticated), useRealm.ts
    (decodes %2F-encoded realmPath from URL param), useAlert.ts (message queue with
    auto-dismiss). Created services/logout.ts (REST POST /auth/logout + cookie cleanup +
    full page reload to Backbone login). Created router/guards.ts (authGuard checks
    isAuthenticated + role requirements, defaultRouteGuard redirects based on admin/user
    role). Created App.vue (root layout: AppHeader + AlertContainer + router-view + AppFooter).
    Created AppHeader.vue (Bootstrap 3 navbar: logo, admin/user nav links filtered by
    route.meta.navGroup + hasRole, user dropdown with logout, help link). Created
    AppFooter.vue (mailto, copyright, version for realm admins). Created AlertContainer.vue
    (fixed-position alert divs from useAlert composable, dismissable). Created 4 layout
    wrappers: RealmLayout.vue (sidebar with dashboard/authentication/services/sessions/
    authorization/scripts nav items, realm-scoped routes), ServerLayout.vue (8-item
    sidebar for server edit), ServerDefaultsLayout.vue (7-item sidebar for server defaults),
    LabelTreeLayout.vue (UMA: my resources/shared/starred/labels). Created NotFoundView.vue
    and ForbiddenView.vue (404/403 error pages). Created 64 placeholder view components
    (stubs showing route name + Backbone view path). Updated main.ts with bootstrap
    sequence: fetch /json/serverinfo/* for cookieName → read session cookie → validate
    session via POST /json/sessions?_action=getSessionInfo → fetch user profile via
    POST /json/users?_action=read → set auth state → configure i18n → apply theme → mount.
    Updated config.ts with version field in GlobalData. Updated smoke.test.ts to install
    router + i18n plugins and stub new child components. Verification: 72/72 tests pass,
    Vite dev server starts on port 3000. vue-tsc blocked by pre-existing minimatch@3.x
    override conflict (not caused by this task).
  status: complete

- id: 3-2
  description: main SPA - common components
  details: |
    Migrated shared components to Vue 3. Created pure TypeScript models
    (JSONSchema.ts, JSONValues.ts, schemaTransforms.ts) ported from AMD ES6 classes,
    fixing lodash 3→4 migration issues (_.pick→_.pickBy, recursive omit). Copied vendored
    JSONEditor 0.7.23 to vendor/, created JSONEditorTheme.ts (eliminated jQuery, converted
    AMD→ES module). Created 5 Vue JSON Schema form components: JSONSchemaForm.vue (mounts
    JSONEditor via onMounted + defineExpose for isValid/getData/setData),
    TogglableJSONSchemaForm.vue (enable/disable toggle), FlatJSONSchemaForm.vue (non-collection
    schemas), GroupedJSONSchemaForm.vue (collection schemas with iteratee pipeline),
    JSONSchemaFormFooter.vue (save/revert buttons). Expanded useAlert.ts with response
    parameter support (extracts responseJSON.message), type constants (TYPE_SUCCESS/INFO/
    WARNING/DANGER), deduplication, and legacy dismiss formula (2500ms + length*20ms).
    Updated AlertContainer.vue with v-html + DOMPurify sanitization for raw HTML messages.
    Created ConfirmDialog.vue (Bootstrap 3 modal with teleport) + useDialog.ts composable
    (Promise-based confirm API). Created InlineEditTable.vue + InlineEditRow.vue (three
    modes: readonly/edit/new, one row editable at a time, select support for enum fields).
    Created SelectInput.vue (custom combobox with search, keyboard nav, scoped slots).
    47 new Vitest tests (33 JSON Schema model + 14 useAlert). 119/119 tests pass,
    vue-tsc clean (0 errors).
  status: complete

- id: 3-3
