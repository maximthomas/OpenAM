- id: 3-5
  description: template codemod + manual fixes
  details: |
    Write Node.js codemod script for 187 Handlebars templates. Automate:
    {{t}} -> {{ $t() }}, {{#if}} -> v-if, {{#each}} -> v-for, data-field -> v-model,
    data-click -> @click. Manual fixes for: partials -> components, routeTo -> router,
    {{#equals}} -> computed.
  status: pending

