# XUI migration task tracker.
# status: todo | in_progress | blocked | done
# Update this file as work lands. Keep route-ownership.yml in sync.
meta:
  project: openam-ui-ria (XUI) modernization
  approach: incremental strangler-fig
  new_mount: /EUI
  legacy_mount: /XUI
  decisions: docs/migration/decisions
  plans: docs/migration/plans

phases:
  - id: phase-0
    name: Foundation (the rails)
    status: done
    tasks:
      - id: P0-0
        title: Create openam-ui-eui Maven module + npm workspace at openam-ui/
        detail: >-
          New module openam-ui/openam-ui-eui (sibling to openam-ui-ria), added to the openam-ui reactor.
          New openam-ui/package.json workspace root with members openam-ui-eui + commons-ui-next (ADR-0009).
        status: done
      - id: P0-1
        title: Scaffold the eui app (Vite + React 19 + TS strict + react-router 7 + Vitest + ESLint 9)
        detail: >-
          App name "eui" inside openam-ui-eui. Scaffold fresh from the standard Vite React-TS template;
          do not copy another module. PATH-RELOCATABLE: Vite base relative/injected (not hardcoded /EUI);
          no absolute /EUI URLs. Same build serves /EUI then /XUI (ADR-0004). Router is HashRouter (no basename); asset relocatability uses Vite base + <base href> (ADR-0011).
        depends_on: [P0-0]
        status: done
      - id: P0-2
        title: Create commons-ui-next workspace package skeleton
        detail: name @openidentityplatform/commons-ui-next; workspace member; empty session/http/i18n/shell/routing modules
        depends_on: [P0-0]
        status: done
      - id: P0-3
        title: Wire openam-ui-eui pom.xml — frontend-maven-plugin (vite build) + maven-assembly-plugin (zip dist as the attached artifact)
        detail: >-
          PRODUCER side only. Mirrors the openam-ui-ria producer pattern: frontend-maven-plugin runs
          the vite build, then maven-assembly-plugin zips the dist and attaches it as the openam-ui-eui
          module artifact. Does NOT touch any war/webapp. Keep the legacy openam-ui-ria Grunt build
          running in parallel. The CONSUMER side (unpacking that artifact into the packaged war at /EUI)
          lives in openam-server-only — a separate module, not in the openam-ui reactor — and is split
          out to P1-7, deferred to phase-1.
        depends_on: [P0-1]
        status: done
      - id: P0-4
        title: Establish route-ownership map + CrossLink helper
        detail: >-
          App-agnostic mechanism in commons-ui-next/routing (createCrossLinkResolver +
          <CrossLink>/<CrossLinkProvider>, ADR-0002): same-app routes navigate in-app (react-router
          Link, root-relative), other-owner routes are full-page <a> handoffs to that app's mount
          (ADR-0004). App data (route-ownership map mirroring route-ownership.yml + mounts) lives in
          openam-ui-eui/src/config/routeOwnership.ts, wired via the provider in main.tsx. A Vitest
          sync test parses route-ownership.yml and fails on drift. All routes still owner: xui
          (nothing migrated yet); slices flip entries. Hash-spelling normalization (legacy #login →
          new #/login) deferred to the compat map (ADR-0011, P1-10).
        depends_on: [P0-1]
        status: done
      - id: P0-5
        title: CI — eslint + vitest for the new app
        detail: >-
          openam-ui-eui/pom.xml currently runs only the vite build (npm run build) — no test/lint
          execution — so the P0-4 route-ownership drift guard and the other Vitest suites do NOT run in
          the Maven/CI build. Add a frontend-maven-plugin npm execution bound to the test phase
          (npm run test:run, plus npm run lint) so drift and regressions fail the build, not just local runs.
        depends_on: [P0-1]
        status: done
      - id: P0-6
        title: Audit who references /XUI URLs (AM config, OAuth2 redirect URIs, docs, integrations)
        detail: >-
          Sizes the must-preserve vs best-effort set for the URL-compat map (ADR-0011).
          Results captured in docs/migration/xui-url-audit.md.
        status: done
      - id: P0-7
        title: Shared mock AM-REST handlers (MSW) — single source of truth
        detail: >-
          ADR-0010. Model /json/authenticate callback flow, /json/serverinfo/*, /json/sessions to start;
          grow per slice. Reused by Vitest, the EUI browser worker, and the standalone mock server.
        depends_on: [P0-0]
        status: done
      - id: P0-8
        title: EUI browser mock mode — setupWorker + VITE_MOCK flag (npm run dev:mock)
        detail: Run the new UI at /EUI in a browser with no OpenAM, against the P0-7 handlers (ADR-0010)
        depends_on: [P0-1, P0-7]
        status: done
      - id: P0-9
        title: Standalone mock server + legacy XUI no-AM harness
        detail: >-
          @mswjs/http-middleware + tiny Node/Express server over the P0-7 handlers. Serve compiled XUI as
          static assets and proxy AM calls to the mock — run the OLD UI in a browser with no OPENAM_HOME/Tomcat (ADR-0010).
        depends_on: [P0-7]
        status: done

  - id: phase-1
    name: Login / auth slice (proves the pattern end-to-end)
    status: in_progress
    depends_on: [phase-0]
    tasks:
      - id: P1-1
        title: SessionService — /json/authenticate callback flow, /json/sessions
        status: done
      - id: P1-2
        title: http client — realm path, CSRF/auth headers, error normalization
        status: done
      - id: P1-3
        title: i18n setup (i18next latest + react-i18next), migrate login locales
        status: done
      - id: P1-4
        title: Shell skeleton — header/footer/nav
        status: done
      - id: P1-5
        title: Migrate login — RESTLoginView + login dialog
        detail: >-
          Split into a minimal first slice (this task) + P1-5b. This slice: single-stage
          username/password login only, driven by the real /json/authenticate protocol via
          commons-ui-next/auth, mounted at /EUI/#/login, validated against the MSW mock. Introduces
          TanStack Query. Success redirects to app home "/" only (goto/realm/fragment params
          deferred). route-ownership login flipped to owner: eui, status: in_progress (NOT
          migrated — parity incomplete until the P1-5b–f login-parity split lands). See
          docs/migration/reference/legacy-login.md for the full legacy feature map.
        depends_on: [P1-1, P1-2, P1-4]
        status: in_progress
      # P1-5b was too big for one task (~9 legacy sub-features / ~1,200 LOC), so it is split into
      # P1-5b..P1-5g. Login route stays status: in_progress across the whole split; flip to
      # status: migrated only when P1-5f (the parity gate) lands. Shared research + split rationale:
      # docs/migration/plans/README.md.
      - id: P1-5b
        title: Login parity (engine) — multi-stage callback loop + generic callback renderer
        detail: >-
          First and largest sub-task of the P1-5b–g login-parity split. THIS task = the callback
          engine only: widen the commons-ui-next/auth callback model to an open type: string + typed
          guards; add a reusable commons-ui-next CallbackForm renderer (Name/Default, Password,
          TextInput, HiddenValue, Choice, Confirmation, TextOutput msg 0/1/2 as alerts); drive a
          multi-stage loop (start→render→submit→repeat until success/failure) from an eui
          TanStack-Query hook; refactor P1-5's single-stage LoginPage/useLogin to run through it (one
          code path); restart-on-failure; field labels from the AM output prompt; extend MSW with a
          synthetic multi-stage fixture set + stage state-machine. Redirect/Polling, goto,
          existing-session, zero-page, dialog, error/expired/logout views, remember-me, and
          ScriptTextOutput execution are all deferred to P1-5c..P1-5g. Login route stays
          status: in_progress.
        depends_on: [P1-5]
        plan: docs/migration/plans/P1-5b-callback-engine.md
        status: done
      - id: P1-5c
        title: Login parity — RedirectCallback (SAML/OAuth) + PollingWaitCallback (push) + 408 retry
        detail: >-
          Special callbacks that alter the engine loop: RedirectCallback builds a form POST / GET
          navigation to an external IdP (SAML/OAuth federation); PollingWaitCallback auto-resubmits
          after waitTime (push auth); plus AuthNService-style 408 timeout-retry. Adds MSW
          redirect/polling scenarios. See docs/migration/plans/P1-5c-redirect-polling.md.
        depends_on: [P1-5b]
        plan: docs/migration/plans/P1-5c-redirect-polling.md
        status: done
      - id: P1-5d
        title: Login parity — goto/realm/fragment params + validateGoto
        detail: >-
          Entry + success URL handling: parse fragment+query params, map legacy shorthand
          (authlevel/module/service/user/resource → authIndexType/authIndexValue), realm handling,
          and the open-redirect guard via POST /json/users?_action=validateGoto. Coordinate with
          P1-10 (hash-spelling normalization) on query-param preservation + entry point. See
          docs/migration/plans/P1-5d-goto-validate.md.
        depends_on: [P1-5b]
        plan: docs/migration/plans/P1-5d-goto-validate.md
        status: done
      - id: P1-5e
        title: Login parity — existing-session/realm-change (confirmLogin) + zero-page/auto-login
        detail: >-
          Session-on-entry + URL-driven auto-submit: if the initial /json/authenticate already
          carries a tokenId, detect the existing session; realm-change → confirmLogin flow
          (RESTConfirmLoginView); arg=newsession force-logout; zero-page/auto-login maps IDTokenN URL
          params to callbacks and submits without rendering the form (zeroPageLogin.enabled gate +
          autoLoginAttempts guard; referrer whitelist gate implemented in P1-5h). See
          docs/migration/plans/P1-5e-existing-session-zeropage.md.
        depends_on: [P1-5b, P1-5d]
        plan: docs/migration/plans/P1-5e-existing-session-zeropage.md
        status: done
      - id: P1-5f
        title: "Login parity (GATE) — session dialog + LoginFailure/SessionExpired/logout views + remember-me"
        detail: >-
          Ancillary UI + modal + logout: session-timeout re-auth dialog (RESTLoginDialog — reuse the
          engine form in a modal; admin modal vs self-service full logout); LoginFailure /
          SessionExpired / RESTLogoutView views; remember-me (persist username); failure navigation
          (gotoOnFail param + 401 detail.failureUrl — legacy goToFailureUrl). PARITY GATE — once
          this lands, flip route-ownership.yml login -> status: migrated and keep the TS mirror
          (openam-ui-eui/src/config/routeOwnership.ts) in sync. Gate must NOT flip login ->
          migrated until P1-5h (serverinfo zeroPageLogin contract fix) and P1-5i (redirect
          return-leg resume) also land. See docs/migration/plans/P1-5f-dialog-error-views-rememberme.md.
        depends_on: [P1-5b, P1-5h, P1-5i]
        plan: docs/migration/plans/P1-5f-dialog-error-views-rememberme.md
        status: todo
      - id: P1-5g
        title: Login parity — ScriptTextOutput execution (device-print/WebAuthn/reCAPTCHA)
        detail: >-
          Hardened handling of TextOutputCallback messageType 4 (ScriptTextOutput), which legacy
          executed as raw server-provided JS (device print, WebAuthn, reCAPTCHA hooks). Deferred from
          P1-5b as security-sensitive; not required for the parity gate and may be re-prioritized into
          a later auth-module slice. See docs/migration/plans/P1-5g-scripttextoutput.md.
        depends_on: [P1-5b]
        plan: docs/migration/plans/P1-5g-scripttextoutput.md
        status: todo
      - id: P1-5h
        title: Login parity — serverinfo zeroPageLogin contract fix + referrer whitelist
        detail: >-
          Reshaped commons-ui-next/serverinfo's AmServerInfo.zeroPageLoginAllowed (a flat boolean that
          did not exist in real AM) to the real zeroPageLogin object ({enabled, refererWhitelist,
          allowedWithoutReferer} — ServerInfo.java:87, ServerInfoResource.java:185) and implemented
          isZeroPageLoginAllowed (commons-ui-next/src/serverinfo/zeroPageLogin.ts), an exact port of
          legacy RESTLoginView.isZeroPageLoginAllowed, wired into LoginPage's zero-page gate. Also
          dropped two other invented AmServerInfo fields (FQDN, inplaceUpgrade) with no ServerInfo.java
          counterpart, found during the field-name audit. ADR-0010 drift instance found by the 2026-07
          docs review. See docs/migration/plans/review-remediation-2026-07.md, Stage 4.
        depends_on: [P1-5e]
        plan: docs/migration/plans/review-remediation-2026-07.md
        status: done
      - id: P1-5i
        title: Login parity — RedirectCallback return-leg resume (authId tracking cookie)
        detail: >-
          P1-5c stored nothing across a federation (SAML/OAuth) IdP round-trip, so a redirect login
          restarts at stage 1 on return instead of resuming. Mirror the legacy authId tracking-cookie
          protocol (AuthNService.js) to store/resume/clear across the redirect. Found by the 2026-07
          docs review. See docs/migration/plans/review-remediation-2026-07.md, Stage 5.
        depends_on: [P1-5c]
        plan: docs/migration/plans/review-remediation-2026-07.md
        status: todo
      - id: P1-6
        title: Migrate anonymousProcess — password reset, self-register, forgot username
        detail: >-
          Also owns rendering the login page's self-service links (showForgotPassword /
          showForgotUserName / showSelfRegistration from serverinfo flags) — P1-5f's parity gate
          explicitly excludes them (see plans/P1-5f-dialog-error-views-rememberme.md Out of scope).
        depends_on: [P1-1, P1-2]
        status: todo
      - id: P1-7
        title: Wire openam-server-only — consume the openam-ui-eui artifact into the packaged war at /EUI
        detail: >-
          CONSUMER/war side, split from P0-3 (the producer). Lives in openam-server-only/pom.xml (a
          separate module, NOT in the openam-ui reactor). Add the openam-ui-eui dependency,
          maven-dependency-plugin:unpack into ${project.build.directory}/EUI, and a maven-war-plugin
          <webResource> mapping target/EUI -> targetPath EUI. Mirrors the existing openam-ui-ria -> /XUI
          wiring exactly; leaves /XUI untouched (true side-by-side). GATE (per the "migration works with
          mock server" decision): do NOT make this production-war edit until the login slice (P1-5) is
          validated against the mock server (P0-7 handlers + P0-8 dev:mock). Until then the eui artifact
          is produced (P0-3) but not deployed into the server war.
        depends_on: [P0-3, P1-5]
        status: todo
      - id: P1-8
        title: Deploy /EUI side by side; legacy /XUI login redirects to /EUI/#/login
        depends_on: [P1-7, P1-5]
        status: todo
      - id: P1-9
        title: Lock testing patterns (Vitest + Testing Library + MSW for AM REST)
        detail: >-
          Patterns established in P0-5/P1-5 and documented in reference/eui-foundation.md (Vitest +
          Testing Library + shared MSW handlers, setup in src/test/setup.ts).
        status: done
      - id: P1-10
        title: Hash-spelling normalization map — legacy #login forms -> react-router #/login
        detail: >-
          ADR-0011. The new app is HashRouter-routed and emits #/login (leading slash); legacy
          used #login (no leading slash) and #!/... forms. On load, detect these legacy spellings
          and client-side redirect to the #/... equivalent, preserving query params. Must-preserve
          spellings from the P0-6 audit (docs/migration/xui-url-audit.md): #login -> #/login,
          #!/X -> #/X; composite & fragment params (#login&realm=/x&goto=... ->
          #/login?realm=/x&goto=...), since react-router useSearchParams only sees ?-delimited
          params but legacy parsed &-composites; realm path-suffix (#login/myRealm ->
          #/login?realm=/myRealm); outside-hash query (/XUI/?realm=x#login — merge
          window.location.search into the fragment query, since HashRouter never sees
          location.search); anonymous-process/aux routes (#passwordReset/..., #register/...,
          #continuePasswordReset... regex, #logout/, #failedLogin..., #confirmLogin/), grown per
          slice; phase-2/3 appends (#uma/share/{id}, #uma/requests/{id},
          #realms/%2F/dashboard). confirm.html is a static page -> cutover/P4 concern, not hash
          normalization. Constraint (from P1-5d): normalization must preserve every query param.
          Start with auth URLs; each later slice appends its mappings. Simpler than the
          originally-planned hash-to-history translation map, superseded by ADR-0011 (no
          hash->history translation needed).
        depends_on: [P1-5]
        status: todo

  - id: phase-2
    name: User self-service (~5.3k LOC)
    status: todo
    depends_on: [phase-1]
    tasks:
      - id: P2-1
        title: Dashboard
        status: todo
      - id: P2-2
        title: OAuth2 token views
        status: todo
      - id: P2-3
        title: UMA sharing
        status: todo
      - id: P2-4
        title: Profile / KBA (services/KBADelegate)
        status: todo
      - id: P2-5
        title: "RISK GATE — rjsf vs jsoneditor gap analysis (do BEFORE phase-3)"
        detail: Custom widgets, conditional schemas, inline validation. Build custom-widget set in commons-ui-next.
        status: todo
      - id: P2-6
        title: Social login buttons on login page (socialImplementations from serverinfo)
        detail: >-
          P1-5f's parity gate explicitly excludes social login; needs serverinfo
          socialImplementations modeling. Found by the 2026-07 docs review.
        status: todo

  - id: phase-3
    name: Admin (~13.4k LOC — the bulk; split into shippable sub-slices)
    status: todo
    depends_on: [phase-2]
    tasks:
      - id: P3-1
        title: Realms — list, create, overview
        status: todo
      - id: P3-2
        title: Authentication — chains/modules/trees, services
        status: todo
      - id: P3-3
        title: Applications / Agents (reuse existing .jsx), Data Stores
        status: todo
      - id: P3-4
        title: Sessions (already React), Scripting (already React), API/OAuth2 views
        status: todo
      - id: P3-5
        title: Global configuration + deployment
        status: todo

  - id: phase-4
    name: Cutover & cleanup
    status: todo
    depends_on: [phase-3]
    tasks:
      - id: P4-1
        title: Cutover — deploy new app build output to canonical /XUI; retire /EUI (or alias -> /XUI)
        detail: One swap at the end. New build serves from /XUI unchanged (path-relocatable, P0-1).
        status: todo
      - id: P4-2
        title: Finalize URL-compat map — full legacy /XUI deep-link coverage verified
        detail: ADR-0011. All must-preserve URLs from the P0-6 audit redirect correctly.
        depends_on: [P4-1]
        status: todo
      - id: P4-3
        title: Relocate migration docs (docs/migration) out of openam-ui-ria before deleting it
        detail: Move into openam-ui-eui (or archive); they currently live in the legacy module
        status: todo
      - id: P4-4
        title: Remove the legacy openam-ui-ria module — delete it from the openam-ui reactor and the repo
        detail: >-
          Per ADR-0009 teardown = delete the whole module (Backbone/Handlebars/RequireJS src, Grunt/r.js/Karma/Babel,
          and the org.openidentityplatform.commons.ui:user dependency + target/ compose pipeline go with it).
        depends_on: [P4-1, P4-3]
        status: todo

  - id: phase-5
    name: Extract commons-ui-next upstream
    status: todo
    depends_on: [phase-4]
    tasks:
      - id: P5-1
        title: Move commons-ui-next into the Open Identity Platform commons repo
        status: todo
      - id: P5-2
        title: Publish it (npm package + optional Maven www zip)
        status: todo
      - id: P5-3
        title: Flip the eui app import from workspace:* to the published version
        status: todo
