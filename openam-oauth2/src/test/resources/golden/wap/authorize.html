<wml>
<card id="info" newcontext="true">
        <h2>OAuth authorization page</h2>
        <section id="intro">
            <h2>Application requesting scope</h2>

            <p>Demo &amp; Co:</p>
            <p>A demo client for the &quot;consent&quot; page </p>
        </section>
</card>
<card id="form" newcontext="true">
        <form action="/openam/oauth2/authorize?client_id=test_client_app&amp;response_type=code" method="post">
            <h4>The following private info is requested</h4>
            <br/>
            <!-- Optional parameters -->
            <input type="hidden" name="realm" value="/"/>
            <input type="hidden" name="redirect_uri" value="https://rp.example.com/callback"/>
            <input type="hidden" name="scope" value="openid profile email"/>
            <input type="hidden" name="state" value="af0ifjsldkj"/>
            <input type="hidden" name="nonce" value="n-0S6_WzA2Mj"/>
            <input type="hidden" name="acr" value="urn:mace:incommon:iap:silver"/>
            <input type="hidden" name="csrf" value="1a2b3c4d-5e6f-7081-92a3-b4c5d6e7f809"/>
            <!-- Required parameters -->
            <input type="hidden" name="response_type" value="code"/>
            <input type="hidden" name="client_id" value="test_client_app"/>
            Save Consent: <input type="checkbox" name="save_consent" />
            <!-- Custom parameters -->
            <!--input type="hidden" name="decision" value="allow"/>
            <input type="submit" value="Allow access" class="button save"/>
            <input type="hidden" name="decision" value="deny"/>
            <input type="submit" value="No Thanks" class="button"/-->
            <input type="submit" name="decision" class="button gray" value="Allow"/>
            <input type="submit" name="decision" class="button gray" value="Deny"/>
        </form>
</card>
</wml>
