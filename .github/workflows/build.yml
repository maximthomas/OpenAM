name: Build 

on:
  push:
    branches: [ 'sustaining/15.2.x','master','issues/**','features/**' ]
  pull_request:
jobs:
  
  ui-smoke-tests:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Set Integration Test Environment
        run: |
          echo "127.0.0.1 idp.acme.org sp.mycompany.org" | sudo tee -a /etc/hosts

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers
          restore-keys: ${{ runner.os }}-playwright-

      - name: UI Smoke Tests (Playwright)
        run: |
          cd e2e
          npm init -y
          npm install @playwright/test
          npx playwright install chromium --with-deps
          npx playwright test --reporter=list

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: failure-ui-java${{ matrix.java }}-${{ matrix.context_label }}-${{ matrix.samples_label }}
          retention-days: 1
          path: |
            e2e/playwright-report/**
            e2e/test-results/**