#
# Runs the XUI end-to-end suite against the instance e2e/local/openam-up.sh stands up -- the same
# script a contributor runs, so the documented setup is exercised on every run rather than only
# when someone happens to try it. The XUI smoke steps in build.yml stay where they are: they run
# against that job's own containers and cover the HttpOnly matrix, which this job does not.
#
# EXPECTED-RED WINDOW -- OPENS AT TASK 4.1 OF modernize-openam-ui-build
#
# This lane fails, on every run, from the commit that adds Vite until the AMD-to-ESM conversion
# lands. That is accepted and recorded, not a regression to investigate, and the failure is real
# rather than flaky: it will not go green by re-running.
#
# Why: 4.1 switches frontend-maven-plugin from Grunt to `vite build` deliberately ahead of the
# source conversion, so that the remaining phase-1 tasks have a Vite build to extend. Vite does not
# reject AMD -- it accepts it, exits 0, and emits a bundle that does nothing. With 203 of 213
# sources still opening with `define(`, `mvn package` succeeds and produces a two-file
# target/compiled and a ~4.6 kB -www.zip in place of the ~2 MB Grunt one. The build is green; the
# UI it ships is not a UI. This job stands up AM from that war and drives it through a browser, so
# it fails at the first navigation.
#
# Do NOT "fix" a failure here by reverting the Vite switch or by pinning this lane to a Grunt build.
# The window closes on its own: 5.1 converts the modules, 6.1 adds the runtime module registry the
# converted tree needs, 9.3 owns re-wiring the test commands into CI, and 10.1 is the release gate
# that must be green against a deployed instance before any of this ships. If this lane is still red
# after 6.1, that IS a regression -- investigate it then.
name: XUI end-to-end

# No schedule yet, deliberately: the suite is still thin while tasks 1.6-1.12 land, so a periodic
# run would prove the harness starts and little else. Revisit once it has coverage -- an AM-side
# change that breaks the XUI does not touch the paths below, and so does not trigger this job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'openam-ui/**'
      - 'e2e/**'
      # openam-up.sh un-comments the COPY lines in this Dockerfile and fails if the pattern
      # stops matching, so a change to it can break this job without touching the UI.
      - 'openam-distribution/openam-distribution-docker/Dockerfile'
      - '.github/workflows/xui-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xui-e2e:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Java 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'zulu'

      # Namespaced away from build.yml's key: that job runs `verify`, this one runs `install`, so
      # this cache also holds every OpenAM module's own artifacts. Sharing one key would push a
      # much larger repository onto build.yml's matrix legs, which do not need it. The second
      # restore-key still gives this job a warm start from build.yml's cache.
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-e2e-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-e2e-
            ${{ runner.os }}-m2-repository

      # Keyed on the manifest, so a Playwright version bump re-downloads the browser once and
      # then caches it, rather than re-downloading it on every run behind a stale exact hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # AM will not run on a bare hostname -- it has to be able to set a cookie domain. lib.sh
      # checks for this entry and fails with the same instruction if it is missing.
      - name: Prepare environment
        shell: bash
        run: echo "127.0.0.1 openam.example.org" | sudo tee -a /etc/hosts

      # openam-up.sh builds its image from the war and the two tool zips in target/, so they have
      # to exist first. This is the `mvn -DskipTests install` that e2e/local/README.md asks for.
      - name: Build the artifacts the instance is assembled from
        env:
          MAVEN_OPTS: -Dhttps.protocols=TLSv1.2 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Dmaven.wagon.http.retryHandler.count=10
        run: mvn --batch-mode --errors -DskipTests install --file pom.xml

      - name: Install the suite
        working-directory: e2e
        run: |
          npm install
          npm run setup -- --with-deps

      - name: Start the OpenAM instance
        working-directory: e2e/local
        run: ./openam-up.sh

      # No --reporter here: a CLI reporter REPLACES the config's list rather than adding to it,
      # which would suppress the HTML report the failure bundle below collects. The config
      # already declares both the list and the HTML reporter.
      - name: XUI end-to-end suite
        working-directory: e2e
        run: npm run test:xui

      # Both containers run with --rm and the runner is discarded, so anything not pulled out
      # here is gone. Tomcat's stdout and AM's debug files are where a server-side failure is
      # actually legible -- see e2e/local/README.md, Troubleshooting. Container names are
      # lib.sh's. Every command is best-effort: a container that never started is itself the
      # finding, and must not mask the test failure that got us here.
      - name: Collect instance diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          docker logs openam-idp > e2e/openam-idp.log 2>&1 || true
          docker logs opendj-idp > e2e/opendj-idp.log 2>&1 || true
          docker exec openam-idp bash -c '
            for f in $(find /usr/openam -maxdepth 6 -type f -path "*/debug/*" 2>/dev/null); do
              echo "===== $f ====="
              cat "$f"
            done' > e2e/openam-debug.log 2>&1 || true

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: failure-xui-e2e
          retention-days: 5
          path: |
            e2e/playwright-report/**
            e2e/test-results/**
            e2e/openam-idp.log
            e2e/opendj-idp.log
            e2e/openam-debug.log

      - name: Tear the instance down
        if: ${{ always() }}
        working-directory: e2e/local
        run: ./openam-down.sh
